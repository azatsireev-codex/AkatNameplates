menu:
  title: "&8Сообщения входа/выхода"
  rows: 6
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  option-lore:
    - "&7Вход: {join}"
    - "&7Выход: {quit}"
    - " "
    - "{price}"
    - "{click-action}"
  purchased-click-action: "&eЛКМ - Активировать"
  unpurchased-click-action: "&eЛКМ - Купить за кубиславы\n&eПКМ - Купить за нефткоины"
  price-formats:
    points: "&b{amount} кубиславов"
    neft: "&a{amount} нефткоинов"
    both: "&7Цена:
{points}
{neft}"

messages:
  default_plus:
    permission: "joinquit.message.default_plus"
    neft-price: 100
    points-price: 100 # Если указаны оба >0, игрок может купить за любую из валют
    icon: "PAPER"
    hidden-from-shop: false
    join: "<gradient:#55ff55:#00aa00>+ {player}</gradient>"
    quit: "<gradient:#ff5555:#aa0000>- {player}</gradient>"

  royal:
    permission: "joinquit.message.royal"
    neft-price: 500
    points-price: 0 # Только нефткоины
    icon: "BOOK"
    hidden-from-shop: true # Скрыт из общего списка, но виден игрокам с permission
    join: "#ffd700✦ &f{player} &7воссиял на сервере"
    quit: "#ffd700✦ &f{player} &7покинул королевство"

database:
  # mariadb | sqlite
  type: "mariadb"

  # Настройки MariaDB (используются когда type: mariadb)
  host: "127.0.0.1"
  port: 3306
  name: "nameplates"
  user: "root"
  password: "change-me"

  # Настройки SQLite (используются когда type: sqlite)
  sqlite:
    file: "joinquit-messages.db"
